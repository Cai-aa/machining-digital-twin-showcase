async function decrypt(raw){
const key=await crypto.subtle.importKey('raw',raw,{name:'AES-GCM'},false,['decrypt']);
const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:from64(CONFIG.iv),additionalData:encoder.encode('machining-showcase-login-v1'),tagLength:128},key,from64(CONFIG.ciphertext));
return new TextDecoder('utf-8',{fatal:true}).decode(plain);
}
function openContent(content){
const parsed=new DOMParser().parseFromString(content,'text/html');
const scripts=Array.from(parsed.querySelectorAll('script')).map(function(node){const code=node.textContent;node.remove();return code;});
document.title=parsed.title;
document.documentElement.lang=parsed.documentElement.lang||'zh-CN';
document.head.replaceChildren.apply(document.head,Array.from(parsed.head.childNodes).map(function(node){return document.importNode(node,true);}));
document.body.className=parsed.body.className;
document.body.replaceChildren.apply(document.body,Array.from(parsed.body.childNodes).map(function(node){return document.importNode(node,true);}));
scripts.forEach(function(code){const initialize=new Function(code);initialize();});
const target=location.hash?document.getElementById(location.hash.slice(1)):null;
document.documentElement.style.scrollBehavior='auto';
if(target)target.scrollIntoView({behavior:'auto'});else window.scrollTo(0,0);
document.documentElement.style.removeProperty('scroll-behavior');
}
document.getElementById('reveal-password').addEventListener('click',function(){
const visible=password.type==='password';
password.type=visible?'text':'password';
this.textContent=visible?'隐藏':'显示';
this.setAttribute('aria-label',visible?'隐藏密码':'显示密码');
this.setAttribute('aria-pressed',String(visible));
});
[account,password].forEach(function(input){input.addEventListener('input',function(){error.hidden=true;account.setAttribute('aria-invalid','false');password.setAttribute('aria-invalid','false');});});
form.addEventListener('submit',async function(event){
event.preventDefault();
if(submit.disabled)return;
if(!window.crypto||!window.crypto.subtle){showError('当前浏览器不支持此登录方式，请通过 HTTPS 地址使用最新版 Chrome 或 Edge。');return;}
setBusy(true);error.hidden=true;
try{
const material=await crypto.subtle.importKey('raw',encoder.encode(account.value.trim()+'\u0000'+password.value),'PBKDF2',false,['deriveBits']);
const raw=await crypto.subtle.deriveBits({name:'PBKDF2',salt:from64(CONFIG.salt),iterations:CONFIG.iterations,hash:'SHA-256'},material,256);
const content=await decrypt(raw);
try{sessionStorage.setItem(SESSION,JSON.stringify({id:CONFIG.id,key:to64(raw)}));}catch(storageError){}
password.value='';
openContent(content);
}catch(loginError){setBusy(false);account.setAttribute('aria-invalid','true');password.setAttribute('aria-invalid','true');showError('账号或密码不正确，请重试。');password.focus();}
});
(async function restoreSession(){
if(!window.crypto||!window.crypto.subtle)return;
try{
const saved=JSON.parse(sessionStorage.getItem(SESSION)||'null');
if(saved&&saved.id===CONFIG.id&&typeof saved.key==='string'){
document.querySelector('.card').classList.add('restoring');
const content=await decrypt(from64(saved.key));openContent(content);return;
}
if(saved)sessionStorage.removeItem(SESSION);
}catch(restoreError){try{sessionStorage.removeItem(SESSION);}catch(storageError){}}
document.querySelector('.card').classList.remove('restoring');
})();
})();
</script>
</body>
